<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Greenbook · Una estantería más en casa</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #eeeee5; color: #263d30; font: 13px/1.4 system-ui, sans-serif; }
      main { max-width: 844px; margin: auto; padding: 20px 24px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 17px; }
      h1 { font: 26px/1.15 Georgia, serif; font-weight: 400; margin: 0 0 6px; letter-spacing: -.4px; }
      header p { margin: 0; font-size: 11px; color: #64715f; }
      .try { color: #faf7e8; background: #294b39; border-radius: 10px; padding: 11px 14px; text-decoration: none; white-space: nowrap; font-size: 12px; }
      .comparison { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
      figure { margin: 0; }
      figcaption { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 10px; color: #63715e; }
      figcaption > span { text-transform: uppercase; letter-spacing: 1.1px; }
      button { font: inherit; color: inherit; border: 0; padding: 0; background: none; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
      img { display: block; width: 100%; height: auto; border: 1px solid #d7ddcf; border-radius: 12px; }
      footer { margin-top: 12px; color: #64715f; font-size: 10px; }
      footer a { color: inherit; text-underline-offset: 2px; }
      :focus-visible { outline: 2px solid #8f6c47; outline-offset: 4px; }
      @media(max-width: 620px) {
        main { padding: 18px 12px; }
        header { align-items: flex-start; gap: 12px; }
        h1 { font-size: 22px; }
        header p { font-size: 10px; }
        .try { font-size: 11px; padding: 10px; }
        .comparison { gap: 8px; }
        figcaption { font-size: 8px; }
        figcaption > span { letter-spacing: .6px; }
        footer { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>La estantería, un poco más en casa.</h1><p>Los libros en primer plano. La calidez de la habitación.</p></div>
        <a class="try" href="./mockup.html">Probar mockup ↗</a>
      </header>
      <section class="comparison" aria-label="Comparación de la estantería">
        <figure><figcaption><span id="left-label">Actual</span></figcaption><img id="left" src="../despues-estanteria.png" alt="Estantería actual de la app" width="390" height="844" /></figure>
        <figure><figcaption><span id="right-label">Propuesta móvil</span><button type="button" id="switch" aria-pressed="false">Ver día y noche</button></figcaption><img id="right" src="./dia.png" alt="Mockup propuesto de la estantería de día" width="390" height="844" /></figure>
      </section>
      <footer>Propuesta aplicada · <a href="/estanteria">Abrir la estantería real</a> · <a href="./mockup.html">Consultar el mockup aprobado</a>.</footer>
    </main>
    <script>
      document.querySelector('#switch').addEventListener('click', event => {
        const night = event.currentTarget.getAttribute('aria-pressed') !== 'true';
        event.currentTarget.setAttribute('aria-pressed', String(night));
        event.currentTarget.textContent = night ? 'Comparar con la actual' : 'Ver día y noche';
        document.querySelector('#left-label').textContent = night ? 'Propuesta · día' : 'Actual';
        document.querySelector('#right-label').textContent = night ? 'Propuesta · noche' : 'Propuesta móvil';
        document.querySelector('#left').src = night ? './dia.png' : '../despues-estanteria.png';
        document.querySelector('#right').src = night ? './noche.png' : './dia.png';
        document.querySelector('#left').alt = night ? 'Mockup propuesto de día' : 'Estantería actual de la app';
        document.querySelector('#right').alt = night ? 'Mockup propuesto de noche' : 'Mockup propuesto de día';
      });
    </script>
  </body>
</html>
