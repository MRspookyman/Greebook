<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greenbook · Antes y después</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceee7;color:#263d30;font:14px/1.4 system-ui,sans-serif}main{max-width:844px;padding:22px 24px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:14px}h1{font-size:19px;font-weight:500;margin:0 0 4px}header p{font-size:11px;color:#64715f;margin:0}nav{display:flex;gap:4px;flex-wrap:wrap}button{border:1px solid #d2d8c9;background:transparent;color:inherit;border-radius:6px;padding:8px 10px;font:inherit;font-size:11px;cursor:pointer}button[aria-pressed=true]{background:#294b39;color:#faf7e8;border-color:#294b39}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0}figcaption{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;margin:0 0 9px;color:#63715e}img{display:block;width:100%;height:auto;border:1px solid #d7ddcf;border-radius:10px}footer{font-size:10px;color:#64715f;margin-top:13px}a{color:inherit}@media(max-width:620px){main{padding:18px 12px}.comparison{gap:8px}header{display:block}nav{margin-top:14px}h1{font-size:17px}button{font-size:10px;padding:7px}.comparison figcaption{font-size:8px;letter-spacing:.5px}}
</style>
</head>
<body><main><header><div><h1>Greenbook · Más atmósfera</h1><p>La habitación, con un poco más de magia.</p></div><nav aria-label="Comparar pantalla">
<button data-screen="velas" aria-pressed="true">Velas</button><button data-screen="mesilla" aria-pressed="false">Mesilla</button><button data-screen="estanteria" aria-pressed="false">Estantería</button><button data-screen="notas" aria-pressed="false">Notas</button>
</nav></header><section class="comparison"><figure><figcaption>Antes · primer ajuste</figcaption><img id="before" src="conservador-velas.png" alt="Pantalla de velas antes de los ajustes" width="390" height="844"></figure><figure><figcaption>Después · nueva dirección</figcaption><img id="after" src="despues-velas.png" alt="Pantalla de velas después de los ajustes" width="390" height="844"></figure></section><footer>Capturas reales de la app a 390 × 844 px, con datos de ensayo. <a href="despues-noche-encendida.png">Ver modo nocturno</a>.</footer></main>
<script>
document.querySelectorAll('[data-screen]').forEach(button=>button.addEventListener('click',()=>{const screen=button.dataset.screen;document.querySelector('#before').src='conservador-'+screen+'.png';document.querySelector('#after').src='despues-'+screen+'.png';document.querySelector('#before').alt='Pantalla '+button.textContent+' antes de los ajustes';document.querySelector('#after').alt='Pantalla '+button.textContent+' después de los ajustes';document.querySelectorAll('[data-screen]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}))
</script></body></html>
